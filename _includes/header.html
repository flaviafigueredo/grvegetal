<header class="sticky top-0 z-50 bg-brand border-b border-cream/10">
  <nav class="mx-auto flex h-20 max-w-[1200px] items-center justify-between px-6">
    <a href="/" class="shrink-0">
      <img src="/assets/images/logo-horizontal.svg" alt="GR Vegetal" class="h-24 w-auto">
    </a>

    <ul class="hidden items-center gap-8 md:flex">
      <li>
        <a href="/mentorias/"
          class="border-b-2 border-transparent pb-1 text-sm font-medium text-cream/85 transition hover:border-accent hover:text-accent">
          Mentorias
        </a>
      </li>
      <li>
        <a href="/diagnose/"
          class="border-b-2 border-transparent pb-1 text-sm font-medium text-cream/85 transition hover:border-accent hover:text-accent">
          Diagnose
        </a>
      </li>
      <li>
        <a href="/blog/"
          class="border-b-2 border-transparent pb-1 text-sm font-medium text-cream/85 transition hover:border-accent hover:text-accent">
          Blog
        </a>
      </li>
    </ul>

    <div class="flex items-center gap-4">
      <a href="https://wa.me/{{ site.contact.whatsapp }}" target="_blank" rel="noopener"
        class="hidden rounded bg-accent px-5 py-2.5 text-sm font-medium uppercase tracking-wider text-ink transition hover:brightness-95 md:inline-flex">
        Fale conosco
      </a>

      <!-- mobile -->
      <button id="menu-toggle" type="button" aria-label="Abrir menu" aria-controls="mobile-menu" aria-expanded="false"
        class="-mr-2 p-2 text-cream md:hidden">
        <svg id="icon-menu" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg id="icon-close" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </nav>

  <!-- mobile -->
  <div id="mobile-menu" class="hidden border-t border-cream/10 px-6 py-4 md:hidden">
    <ul class="flex flex-col">
      <li><a href="/mentorias/" class="block py-2 text-cream/85 transition hover:text-accent">Mentorias</a></li>
      <li><a href="/diagnose/" class="block py-2 text-cream/85 transition hover:text-accent">Diagnose</a></li>
      <li><a href="/blog/" class="block py-2 text-cream/85 transition hover:text-accent">Blog</a></li>
    </ul>
    <a href="https://wa.me/{{ site.contact.whatsapp }}" target="_blank" rel="noopener"
      class="mt-3 flex w-full items-center justify-center rounded bg-accent px-5 py-3 text-sm font-medium uppercase tracking-wider text-ink transition hover:brightness-95">
      Fale conosco
    </a>
  </div>

  <script>
    (function () {
      var btn = document.getElementById('menu-toggle');
      var menu = document.getElementById('mobile-menu');
      var iconMenu = document.getElementById('icon-menu');
      var iconClose = document.getElementById('icon-close');
      if (!btn || !menu) return;
      btn.addEventListener('click', function () {
        var nowHidden = menu.classList.toggle('hidden');
        iconMenu.classList.toggle('hidden');
        iconClose.classList.toggle('hidden');
        btn.setAttribute('aria-expanded', String(!nowHidden));
        btn.setAttribute('aria-label', nowHidden ? 'Abrir menu' : 'Fechar menu');
      });
    })();
  </script>
</header>
