<div
  class="flex flex-col border border-clay/15 bg-linen/40 p-8 {% if include.plano.largo %}md:col-span-3{% else %}md:col-span-2{% endif %}">
  <h3 class="font-serif text-2xl text-brand">{{ include.plano.nome }}</h3>
  <p class="mt-3 flex-1 text-ink/70 leading-relaxed text-pretty">{{ include.plano.descricao }}</p>
  <div class="mt-6 font-serif text-3xl text-ink">
    {{ include.plano.preco }}{% if include.plano.unidade %}<span class="text-lg text-ink/60"> {{ include.plano.unidade }}</span>{% endif %}
  </div>
  <a href="{{ include.plano.link }}" class="btn btn-solid mt-6 w-full">Quero este plano</a>
</div>
