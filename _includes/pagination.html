{% if paginator.total_pages > 0 %}
<nav class="mt-16 flex items-center justify-between border-t border-clay/15 pt-8" aria-label="Paginação">
  {% if paginator.previous_page %}
  <a href="{{ paginator.previous_page_path | relative_url }}"
    class="inline-flex items-center gap-2 text-sm font-medium uppercase tracking-wider text-brand transition-colors hover:text-accent">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rotate-180" aria-hidden="true">
      <line x1="5" y1="12" x2="19" y2="12"></line>
      <polyline points="12 5 19 12 12 19"></polyline>
    </svg>
    Anteriores
  </a>
  {% else %}
  <span class="inline-flex items-center gap-2 text-sm font-medium uppercase tracking-wider text-ink/25">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rotate-180" aria-hidden="true">
      <line x1="5" y1="12" x2="19" y2="12"></line>
      <polyline points="12 5 19 12 12 19"></polyline>
    </svg>
    Anteriores
  </span>
  {% endif %}

  <span class="text-sm text-ink/50">
    Página {{ paginator.page }} de {{ paginator.total_pages }}
  </span>

  {% if paginator.next_page %}
  <a href="{{ paginator.next_page_path | relative_url }}"
    class="inline-flex items-center gap-2 text-sm font-medium uppercase tracking-wider text-brand transition-colors hover:text-accent">
    Próximos
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="5" y1="12" x2="19" y2="12"></line>
      <polyline points="12 5 19 12 12 19"></polyline>
    </svg>
  </a>
  {% else %}
  <span class="inline-flex items-center gap-2 text-sm font-medium uppercase tracking-wider text-ink/25">
    Próximos
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="5" y1="12" x2="19" y2="12"></line>
      <polyline points="12 5 19 12 12 19"></polyline>
    </svg>
  </span>
  {% endif %}
</nav>
{% endif %}
