{%- comment -%}
  Item de FAQ com <details> nativo (abre/fecha sem JS).
  Parâmetros: q (pergunta), a (resposta).
  Uso: {% include faq-item.html q="Pergunta?" a="Resposta." %}
{%- endcomment -%}
<details class="group border-b border-clay/15 py-5">
  <summary class="flex cursor-pointer items-center justify-between gap-4 font-medium text-ink list-none">
    {{ include.q }}
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-brand transition-transform group-open:rotate-45" aria-hidden="true">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </summary>
  <p class="mt-3 text-ink/70 leading-relaxed">
    {{ include.a }}
  </p>
</details>
