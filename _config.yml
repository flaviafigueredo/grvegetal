title: GR Vegetal
description: Consultoria e pesquisa agronômica — fitopatologia, fisiologia vegetal e melhoramento de plantas.
lang: pt-BR

url: "https://grvegetal.com.br"
baseurl: ""

youtube_channel_id: "UCzFoDlwD1f7_Ry2M80HfD8A"

contact:
  whatsapp: "5542984066897"

permalink: /blog/:slug/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-tailwind
  - jekyll-paginate-v2

pagination:
  enabled: true
  per_page: 20
  permalink: /:num/
  sort_reverse: true
  sort_field: date

tailwind:
  input: assets/css/app.css
  minify: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
