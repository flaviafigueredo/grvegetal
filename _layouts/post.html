---
layout: default
---
<article>
  <header class="relative overflow-hidden bg-brand-deep">
    {% if page.cover %}
    <img src="{{ page.cover }}" alt="{{ page.cover_alt | default: page.title }}"
      class="absolute inset-0 h-full w-full object-cover" width="1600" height="900">
    {% else %}
    <img src="/assets/images/hero/hero-blog.webp" alt="Lavoura" class="absolute inset-0 h-full w-full object-cover"
      fetchpriority="high" width="1600" height="900">
    {% endif %}
    <div class="absolute inset-0 bg-black/80">
    </div>

    <div class="relative mx-auto max-w-[720px] px-6 py-16 md:py-20">
      <nav class="text-sm text-cream/70" aria-label="Você está em">
        <a href="/blog/" class="underline transition-colors hover:text-accent">Blog Agrimycologia</a>
        <span class="mx-2" aria-hidden="true">›</span>
        <span class="text-cream/50">{{ page.title }}</span>
      </nav>
      <h1 class="mt-6 font-serif text-3xl leading-tight text-cream md:text-4xl lg:text-5xl text-balance">
        {{ page.title }}
      </h1>
      <p class="mt-4 text-sm text-cream/60">
        {% include data-pt.html date=page.date %}{% if page.author %} · {{ page.author }}{% endif %}
      </p>
    </div>
  </header>

  <div class="mx-auto max-w-[720px] px-6 py-12 md:py-16">
    <div class="legal-prose">
      {{ content }}
    </div>
  </div>

  <div class="mx-auto max-w-[720px] px-6 pb-16">
    <a href="/blog/"
      class="inline-flex items-center gap-2 text-sm font-medium uppercase tracking-wider text-brand transition-colors hover:text-accent">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="rotate-180"
        aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
      Voltar para o blog
    </a>
  </div>
</article>
