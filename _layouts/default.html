<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'pt-BR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {%- seo -%}
    {%- feed_meta -%}
    <link rel="icon" type="image/png" href="/assets/images/favicon/favicon.png">
    {% if page.hero_image_preload %}
    <link rel="preload" as="image" href="{{ page.hero_image }}" type="image/webp" fetchpriority="high">
    {% endif %}
    <link href="/assets/css/app.css" rel="stylesheet">
  </head>
  <body class="font-sans bg-cream text-ink">
    {% include header.html %}

    <main>
      {{ content }}
    </main>
  </body>
</html>
